PLG_TASK_PHOCACARTSUBSCRIPTION_EXPIRATION_TITLE="Phoca Cart Subscription: Expiration Check"
PLG_TASK_PHOCACARTSUBSCRIPTION_EXPIRATION_DESC="This task automatically checks for active subscriptions that have reached their end date. It updates their status to 'Expired' and restricts access to subscription-based content or services once the period has concluded."
PLG_TASK_PHOCACARTSUBSCRIPTION_NOTIFICATIONS_TITLE="Phoca Cart Subscription: Expiration Notifications"
PLG_TASK_PHOCACARTSUBSCRIPTION_NOTIFICATIONS_DESC="This task scans for upcoming subscription renewals and expirations. It sends automated email alerts to users a specified number of days before their subscription ends, ensuring they have sufficient time to renew and avoid service interruption."
PLG_TASK_PHOCACARTSUBSCRIPTION="Task - Phoca Cart Subscription"
